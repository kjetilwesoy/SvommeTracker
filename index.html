<!-- =====================================================
     AI LØPSANALYSE
===================================================== -->

<section
    id="page-aianalysis"
    class="page">

    <h1>🤖 AI Løpsanalyse & Diagnose</h1>
    <p class="subtitle">Registrer 15m start og splitter for å oppdage tidstap og få treningsforslag</p>

    <div class="card">
        <h2 style="color: #0d6efd;">⚙️ Konfigurasjon</h2>
        
        <div class="calc-grid" style="grid-template-columns: repeat(2, 1fr);">
            <!-- Velg Utøver -->
            <div>
                <label class="form-label fw-bold">Utøver</label>
                <select id="aiAthlete" class="form-select">
                    <option value="Mio Wesøy-Danielsen">Mio Wesøy-Danielsen</option>
                    <option value="Luca Wesøy-Danielsen">Luca Wesøy-Danielsen</option>
                    <option value="Annen svømmer">Annen svømmer</option>
                </select>
            </div>

            <!-- Svømmeart -->
            <div>
                <label class="form-label">Svømmeart</label>
                <select id="aiStroke" class="form-select">
                    <option value="Fri">Fri</option>
                    <option value="Rygg">Rygg</option>
                    <option value="Bryst">Bryst</option>
                    <option value="Fly">Fly</option>
                    <option value="Medley">Medley</option>
                </select>
            </div>

            <!-- Bassengstørrelse -->
            <div>
                <label class="form-label fw-bold">Bassengstørrelse</label>
                <select id="aiPoolSize" class="form-select">
                    <option value="25">25m basseng</option>
                    <option value="50">50m basseng</option>
                </select>
            </div>

            <!-- 15m Start / Utgang -->
            <div>
                <label class="form-label text-primary fw-bold">15m Start/Utgang (sek)</label>
                <input type="text" id="ai15m" class="form-control" placeholder="f.eks 5.85">
            </div>
        </div>
    </div>

    <div class="card">
        <h2>📊 Splitt-tider</h2>
        <p class="text-muted small mb-3">Legg inn minst 2 splitter for analyse. Bruk akkumulert tid.</p>
        
        <div id="aiSplitContainer"></div>
        
        <button type="button" onclick="addAiSplit()" class="btn secondary" style="margin-top: 12px;">
            ➕ Legg til splitt
        </button>
    </div>

    <button type="button" onclick="kjorAiAnalyse()" class="btn btn-primary fw-bold" style="padding: 12px 24px; font-size: 16px;">
        ⚡ Analyser Løp & Finn Tidstap
    </button>

    <!-- Resultatfelt -->
    <div id="aiResultArea" class="card" style="display: none; margin-top: 20px; background: #f0f7ff; border-color: #bfdbfe;"></div>

</section>

<script>

// === AI ANALYSE GLOBALE VARIABLER ===

let aiSplits = [];

// Initialiser splitter ved innlasting
function initializeAiAnalysis() {
    aiSplits = [];
    addAiSplit();
    addAiSplit();
}

function addAiSplit() {
    const splitIndex = aiSplits.length;
    aiSplits.push({ distance: '', time: '' });
    renderAiSplits();
}

function removeAiSplit(index) {
    if (aiSplits.length > 2) {
        aiSplits.splice(index, 1);
        renderAiSplits();
    } else {
        alert('Du må ha minst 2 splitter');
    }
}

function renderAiSplits() {
    let html = '<div class="row g-2">';
    
    aiSplits.forEach((split, i) => {
        html += `
            <div class="col-md-3">
                <label class="form-label small">Splitt ${i + 1}</label>
                <div style="display: flex; gap: 8px;">
                    <input 
                        type="number" 
                        class="form-control" 
                        placeholder="Distanse (m)" 
                        value="${split.distance}"
                        onchange="updateAiSplit(${i}, 'distance', this.value)">
                    <input 
                        type="text" 
                        class="form-control" 
                        placeholder="Tid (sek)" 
                        value="${split.time}"
                        onchange="updateAiSplit(${i}, 'time', this.value)">
                    ${aiSplits.length > 2 ? `<button type="button" class="btn danger" onclick="removeAiSplit(${i})" style="padding: 8px 12px;">🗑️</button>` : ''}
                </div>
            </div>
        `;
    });
    
    html += '</div>';
    document.getElementById('aiSplitContainer').innerHTML = html;
}

function updateAiSplit(index, field, value) {
    aiSplits[index][field] = value;
}

function kjorAiAnalyse() {
    
    const athlete = document.getElementById('aiAthlete').value;
    const stroke = document.getElementById('aiStroke').value;
    const poolSize = parseInt(document.getElementById('aiPoolSize').value);
    const start15m = parseFloat(document.getElementById('ai15m').value);

    // Validering
    if (!start15m || isNaN(start15m) || start15m <= 0) {
        alert('Fyll inn gyldig 15m-tid');
        return;
    }

    const validSplits = aiSplits.filter(s => s.distance && s.time && !isNaN(s.distance) && !isNaN(s.time));
    
    if (validSplits.length < 2) {
        alert('Du må ha minst 2 gyldige splitter (distanse og tid)');
        return;
    }

    // Sorter splitter etter distanse
    validSplits.sort((a, b) => parseInt(a.distance) - parseInt(b.distance));

    // Beregn analyser
    let analysisText = `<h3 style="color: #0d6efd;">📈 Analyse for ${athlete}</h3>`;
    analysisText += `<p><strong>Svømmeart:</strong> ${stroke} | <strong>Basseng:</strong> ${poolSize}m | <strong>15m Start:</strong> ${start15m.toFixed(2)} sek</p>`;

    analysisText += '<h4>Splitt-analyse:</h4>';
    analysisText += '<table style="width: 100%; border-collapse: collapse; margin: 15px 0;">';
    analysisText += `<tr style="background: #e0e7ff; border-bottom: 2px solid #6366f1;">
        <th style="padding: 10px; text-align: left;">Distanse</th>
        <th style="padding: 10px; text-align: left;">Akkumulert tid</th>
        <th style="padding: 10px; text-align: left;">Splitt-tid</th>
        <th style="padding: 10px; text-align: left;">Gjennomsnitt</th>
        <th style="padding: 10px; text-align: left;">Status</th>
    </tr>`;

    let lastDist = 15;
    let lastTime = start15m;
    let allSpeeds = [];

    validSplits.forEach((split, i) => {
        const dist = parseInt(split.distance);
        const time = parseFloat(split.time);
        
        const distanceLeg = dist - lastDist;
        const timeLeg = time - lastTime;
        const avgSpeed = (distanceLeg / timeLeg).toFixed(2);
        
        allSpeeds.push(parseFloat(avgSpeed));

        let status = '✅ God';
        let statusColor = '#16a34a';

        // Enkel analyse basert på siste splitt fart
        if (i > 0) {
            const prevSpeed = allSpeeds[i - 1];
            if (avgSpeed < prevSpeed * 0.95) {
                status = '⚠️ Tap';
                statusColor = '#dc2626';
            } else if (avgSpeed > prevSpeed * 1.02) {
                status = '🚀 Akselererer';
                statusColor = '#2563eb';
            }
        }

        analysisText += `<tr style="border-bottom: 1px solid #e0e7ff;">
            <td style="padding: 10px;"><strong>${dist}m</strong></td>
            <td style="padding: 10px;">${time.toFixed(2)} sek</td>
            <td style="padding: 10px;">${timeLeg.toFixed(2)} sek</td>
            <td style="padding: 10px;"><strong>${avgSpeed} m/s</strong></td>
            <td style="padding: 10px; color: ${statusColor}; font-weight: bold;">${status}</td>
        </tr>`;

        lastDist = dist;
        lastTime = time;
    });

    analysisText += '</table>';

    // Beregn gjennomsnittsfart
    const avgOverall = (allSpeeds.reduce((a, b) => a + b, 0) / allSpeeds.length).toFixed(2);
    const maxSpeed = Math.max(...allSpeeds).toFixed(2);
    const minSpeed = Math.min(...allSpeeds).toFixed(2);

    analysisText += `<div style="background: white; padding: 15px; border-radius: 8px; margin: 15px 0; border-left: 4px solid #2563eb;">
        <p><strong>📊 Statistikk:</strong></p>
        <p>Gjennomsnittsfart: <strong>${avgOverall} m/s</strong> | Toppfart: <strong>${maxSpeed} m/s</strong> | Laveste fart: <strong>${minSpeed} m/s</strong></p>
        <p style="color: #666; font-size: 14px;">Differanse: ${(maxSpeed - minSpeed).toFixed(2)} m/s (${((maxSpeed - minSpeed) / minSpeed * 100).toFixed(1)}% variasjon)</p>
    </div>`;

    // Treningsforslag basert på stroke
    analysisText += '<h4>🎯 Treningsforslag:</h4><ul style="line-height: 1.8;">';

    if (minSpeed < avgOverall * 0.92) {
        analysisText += '<li>⚠️ <strong>Uncontrolled Fade:</strong> Du mister farten mot slutten. Fokuser på:';
        analysisText += '<ul><li>Anaerob trening (200-400m repeater)</li><li>Mental toughness arbeid</li><li>Pacing strategi</li></ul></li>';
    }

    if (maxSpeed > avgOverall * 1.08) {
        analysisText += '<li>💨 <strong>Ujevn start:</strong> Du starter for fort. Fokuser på:';
        analysisText += '<ul><li>Kontrollerbar tempo fra starten</li><li>Negative split trening</li><li>Pulsarbeid</li></ul></li>';
    }

    if (stroke === 'Fri') {
        analysisText += '<li>🏊 <strong>Fri-stil:</strong> Arbeid med stabil slag og kick frekvens</li>';
    } else if (stroke === 'Bryst') {
        analysisText += '<li>🔄 <strong>Bryst:</strong> Perfeksjonering av glide og timing</li>';
    } else if (stroke === 'Rygg') {
        analysisText += '<li>↩️ <strong>Rygg:</strong> Fokuser på vendinger og startteknikk</li>';
    } else if (stroke === 'Fly') {
        analysisText += '<li>🦋 <strong>Fly:</strong> Kondisjonering og strøk-timing er kritisk</li>';
    }

    analysisText += '</ul>';

    // Vis resultater
    const resultArea = document.getElementById('aiResultArea');
    resultArea.innerHTML = analysisText;
    resultArea.style.display = 'block';
    
    // Scroll til resultater
    resultArea.scrollIntoView({ behavior: 'smooth' });
}

// Initialiser ved sideinnlasting
initializeAiAnalysis();

</script>

<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Svømmeresultater & Forbedring</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --border-color: #e2e8f0;
      --success: #10b981;
      --badge-25m: #3b82f6;
      --badge-50m: #8b5cf6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.5;
      padding-bottom: 3rem;
    }

    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    nav {
      display: flex;
      gap: 0.5rem;
    }

    .nav-btn {
      background: transparent;
      border: none;
      padding: 0.5rem 1rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 0.375rem;
      transition: all 0.2s;
    }

    .nav-btn:hover {
      background-color: #f1f5f9;
      color: var(--text-main);
    }

    .nav-btn.active {
      background-color: var(--primary);
      color: #ffffff;
    }

    .container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .page-title {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .page-subtitle {
      color: var(--text-muted);
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
    }

    .controls {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .search-input, .select-input {
      padding: 0.625rem 1rem;
      border: 1px solid var(--border-color);
      border-radius: 0.375rem;
      font-size: 0.95rem;
      outline: none;
      background-color: var(--card-bg);
    }

    .search-input {
      flex: 1;
      min-width: 250px;
    }

    .search-input:focus, .select-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .table-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 0.5rem;
      overflow: hidden;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.95rem;
    }

    th {
      background-color: #f8fafc;
      padding: 0.75rem 1rem;
      font-weight: 600;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-color);
    }

    td {
      padding: 0.875rem 1rem;
      border-bottom: 1px solid var(--border-color);
      vertical-align: middle;
    }

    tr.clickable-row {
      cursor: pointer;
      transition: background-color 0.15s;
    }

    tr.clickable-row:hover {
      background-color: #f1f5f9;
    }

    .pool-badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 0.25rem;
      font-size: 0.75rem;
      font-weight: 700;
      color: white;
      background-color: var(--badge-25m);
    }

    .pool-badge.m50 {
      background-color: var(--badge-50m);
    }

    .badge-fina {
      background-color: #e2e8f0;
      color: #334155;
      padding: 0.15rem 0.4rem;
      border-radius: 0.25rem;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .details-row {
      display: none;
      background-color: #f8fafc;
    }

    .details-row.open {
      display: table-row;
    }

    .details-container {
      padding: 1rem 1.5rem;
      border-left: 4px solid var(--primary);
    }

    .details-table {
      margin-top: 0.5rem;
      background-color: #ffffff;
      border-radius: 0.375rem;
      border: 1px solid var(--border-color);
    }

    .details-table th {
      background-color: #f1f5f9;
      font-size: 0.85rem;
    }

    .details-table td {
      font-size: 0.875rem;
      padding: 0.625rem 0.75rem;
    }

    .chevron {
      display: inline-block;
      transition: transform 0.2s;
      font-size: 0.8rem;
      margin-right: 0.5rem;
      color: var(--text-muted);
    }

    .chevron.rotated {
      transform: rotate(90deg);
    }

    .empty-state {
      padding: 3rem;
      text-align: center;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      🏊‍♂️ SvømmeResultater
    </div>
    <nav>
      <button class="nav-btn active" onclick="byttFane('resultater', event)">Alle Resultater</button>
      <button class="nav-btn" onclick="byttFane('grafer', event)">Grafer & Målinger</button>
    </nav>
  </header>

  <div class="container">

    <!-- FANE 1: ALLE RESULTATER -->
    <div id="view-resultater">
      <h1 class="page-title">Stevneresultater</h1>
      <p class="page-subtitle">Oversikt over alle registrerte tider fra siste stevner.</p>

      <div class="controls">
        <input type="text" id="searchResultater" class="search-input" placeholder="Søk på navnet til svømmer eller øvelse..." oninput="oppdaterVisning()">
        <select id="klubbFilterResultater" class="select-input" onchange="oppdaterVisning()">
          <option value="alle">Klubb: Alle</option>
          <option value="Varodd Svømmeklubb">Varodd Svømmeklubb</option>
          <option value="Vågsbygd SLK">Vågsbygd SLK</option>
        </select>
      </div>

      <div class="table-card">
        <table>
          <thead>
            <tr>
              <th>Dato</th>
              <th>Navn</th>
              <th>Klubb</th>
              <th>Øvelse</th>
              <th>Bane</th>
              <th>Tid</th>
              <th>FINA</th>
            </tr>
          </thead>
          <tbody id="resultaterTableBody">
            <!-- Fylles med JS -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- FANE 2: GRAFER & MÅLINGER -->
    <div id="view-grafer" style="display: none;">
      <h1 class="page-title">Grafer & Målinger (12 mnd)</h1>
      <p class="page-subtitle">Klikk på en svømmer for å se alle øvelser og beregnet forbedringsprosent.</p>

      <div class="controls">
        <input type="text" id="searchGrafer" class="search-input" placeholder="Søk på svømmer..." oninput="oppdaterVisning()">
        <select id="klubbFilterGrafer" class="select-input" onchange="oppdaterVisning()">
          <option value="alle">Klubb: Alle</option>
          <option value="Varodd Svømmeklubb">Varodd Svømmeklubb</option>
          <option value="Vågsbygd SLK">Vågsbygd SLK</option>
        </select>
      </div>

      <div class="table-card">
        <table>
          <thead>
            <tr>
              <th style="width: 30px;"></th>
              <th>Svømmer</th>
              <th>Klubb</th>
              <th>Antall øvelser</th>
              <th>Beste forbedring (12 mnd)</th>
            </tr>
          </thead>
          <tbody id="graferTableBody">
            <!-- Fylles med JS -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    let alleResultater = [];
    let aktivFane = 'resultater';

    async function lastData() {
      try {
        const response = await fetch('data/resultater.json');
        if (!response.ok) throw new Error('Kunne ikke laste data');
        alleResultater = await response.json();
        oppdaterVisning();
      } catch (err) {
        console.error(err);
        document.getElementById('resultaterTableBody').innerHTML = `
          <tr><td colspan="7" class="empty-state">Kunne ikke laste data. Sjekk at data/resultater.json eksisterer.</td></tr>
        `;
      }
    }

    function byttFane(fane, evt) {
      aktivFane = fane;
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById('view-resultater').style.display = 'none';
      document.getElementById('view-grafer').style.display = 'none';

      if (evt && evt.target) {
        evt.target.classList.add('active');
      }

      if (fane === 'resultater') {
        document.getElementById('view-resultater').style.display = 'block';
      } else {
        document.getElementById('view-grafer').style.display = 'block';
      }
      oppdaterVisning();
    }

    function oppdaterVisning() {
      if (aktivFane === 'resultater') {
        visResultater();
      } else {
        visGrafer();
      }
    }

    function visResultater() {
      const sok = document.getElementById('searchResultater').value.toLowerCase();
      const klubbFilter = document.getElementById('klubbFilterResultater').value;
      const tbody = document.getElementById('resultaterTableBody');

      const filtrert = alleResultater.filter(r => {
        const matchetSok = (r.navn && r.navn.toLowerCase().includes(sok)) ||
                           (r.klubb && r.klubb.toLowerCase().includes(sok)) ||
                           (r.ovelse && r.ovelse.toLowerCase().includes(sok));
        const matchetKlubb = klubbFilter === 'alle' || r.klubb === klubbFilter;
        return matchetSok && matchetKlubb;
      });

      if (filtrert.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="empty-state">Ingen resultater funnet.</td></tr>`;
        return;
      }

      tbody.innerHTML = filtrert.map(r => `
        <tr>
          <td>${r.dato || '-'}</td>
          <td><strong>${r.navn}</strong></td>
          <td>${r.klubb || '-'}</td>
          <td>${r.ovelse}</td>
          <td><span class="pool-badge ${r.basseng === '50m' ? 'm50' : ''}">${r.basseng}</span></td>
          <td><strong>${r.tid}</strong></td>
          <td><span class="badge-fina">${r.fina || 0} p</span></td>
        </tr>
      `).join('');
    }

    function visGrafer() {
      const sok = document.getElementById('searchGrafer').value.toLowerCase();
      const klubbFilter = document.getElementById('klubbFilterGrafer').value;
      const tbody = document.getElementById('graferTableBody');

      // Grupper per svømmer
      const utoverMap = {};
      alleResultater.forEach(r => {
        if (!utoverMap[r.navn]) {
          utoverMap[r.navn] = {
            navn: r.navn,
            klubb: r.klubb,
            ovelser: []
          };
        }
        utoverMap[r.navn].ovelser.push(r);
      });

      let utovere = Object.values(utoverMap);

      // Filtrer på søk og valgt klubb
      utovere = utovere.filter(u => {
        const matchetSok = u.navn.toLowerCase().includes(sok) || (u.klubb && u.klubb.toLowerCase().includes(sok));
        const matchetKlubb = klubbFilter === 'alle' || u.klubb === klubbFilter;
        return matchetSok && matchetKlubb;
      });

      if (utovere.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="empty-state">Ingen svømmere funnet.</td></tr>`;
        return;
      }

      // Finn høyeste forbedring per utøver
      utovere.forEach(u => {
        const forbedringer = u.ovelser.map(o => o.forbedring || 0);
        u.maxForbedring = Math.max(...forbedringer, 0);
      });
      utovere.sort((a, b) => b.maxForbedring - a.maxForbedring);

      let html = '';
      utovere.forEach((u, index) => {
        const rowId = `details-${index}`;
        const chevronId = `chevron-${index}`;

        html += `
          <tr class="clickable-row" onclick="toggleDetails('${rowId}', '${chevronId}')">
            <td><span id="${chevronId}" class="chevron">▶</span></td>
            <td><strong>${u.navn}</strong></td>
            <td>${u.klubb || '-'}</td>
            <td>${u.ovelser.length} øvelse(r)</td>
            <td style="color: ${u.maxForbedring > 0 ? 'var(--success)' : 'var(--text-muted)'}; font-weight: bold;">
              ${u.maxForbedring > 0 ? '+' + u.maxForbedring + '%' : '0%'}
            </td>
          </tr>
          <tr id="${rowId}" class="details-row">
            <td colspan="5">
              <div class="details-container">
                <strong>Øvelser og forbedring siste 12 mnd for ${u.navn}:</strong>
                <table class="details-table">
                  <thead>
                    <tr>
                      <th>Øvelse</th>
                      <th>Bane</th>
                      <th>Dårligste (siste 12 mnd)</th>
                      <th>Beste (siste 12 mnd)</th>
                      <th>Forbedring</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${u.ovelser.map(o => `
                      <tr>
                        <td><strong>${o.ovelse}</strong></td>
                        <td><span class="pool-badge ${o.basseng === '50m' ? 'm50' : ''}">${o.basseng}</span></td>
                        <td>${o.daarligste_tid || o.tid}</td>
                        <td><strong>${o.beste_tid || o.tid}</strong></td>
                        <td style="color: ${o.forbedring > 0 ? 'var(--success)' : 'var(--text-muted)'}; font-weight: bold;">
                          ${o.forbedring ? '+' + o.forbedring + '%' : '0%'}
                        </td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </td>
          </tr>
        `;
      });

      tbody.innerHTML = html;
    }

    function toggleDetails(rowId, chevronId) {
      const row = document.getElementById(rowId);
      const chevron = document.getElementById(chevronId);

      if (row.classList.contains('open')) {
        row.classList.remove('open');
        chevron.classList.remove('rotated');
      } else {
        row.classList.add('open');
        chevron.classList.add('rotated');
      }
    }

    window.addEventListener('DOMContentLoaded', lastData);
  </script>
</body>
  </html>

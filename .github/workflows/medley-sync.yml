name: Automatisert Medley Oppdatering

on:
  schedule:
    - cron: '0 6 1,15 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Sjekk ut kildekode
        uses: actions/checkout@v4

      - name: Sett opp Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer avhengigheter
        run: npm install axios cheerio

      - name: Kjør Medley-skraper
        run: node scraper.js

      - name: Lagre og push oppdaterte data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/swimmers.json || true
          git commit -m "Auto-oppdatert svømmedata fra Medley.no" || exit 0
          git push

name: Oppdater Svømmedata fra Medley

on:
  workflow_dispatch:

  schedule:
    - cron: "20 4 * * *"

  push:
    paths:
      - "stevner.txt"
      - "hent_medley.py"
      - "parse_lenex.py"
      - ".github/workflows/medley-sync.yml"

permissions:
  contents: write


jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # HENT REPO
      # ------------------------------------------------------

      - name: Sjekk ut koden
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # PYTHON
      # ------------------------------------------------------

      - name: Sett opp Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.10"


      # ------------------------------------------------------
      # INSTALLER PAKKER
      # ------------------------------------------------------

      - name: Installer Python-pakker
        run: |

          python -m pip install --upgrade pip

          pip install requests beautifulsoup4


      # ------------------------------------------------------
      # FINN STEVNER
      # ------------------------------------------------------

      - name: Finn Medley-stevner siste 12 måneder
        run: |

          python hent_medley.py


      # ------------------------------------------------------
      # HENT RESULTATER
      # ------------------------------------------------------

      - name: Hent og parse svømmeresultater
        run: |

          python parse_lenex.py


      # ------------------------------------------------------
      # KONTROLLER DATA
      # ------------------------------------------------------

      - name: Vis resultatstatistikk
        run: |

          python - <<'PY'

          import json

          from collections import Counter


          with open(
              "data/resultater.json",
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          print()
          print("=" * 60)
          print("RESULTATSTATISTIKK")
          print("=" * 60)

          print(
              f"Totalt resultater: {len(data)}"
          )


          svommere = {

              (
                  x.get("klubb", ""),
                  x.get("navn", "")
              )

              for x in data
          }


          print(
              f"Antall svømmere: "
              f"{len(svommere)}"
          )


          klubber = Counter(
              x.get(
                  "klubb",
                  ""
              )
              for x in data
          )


          print()
          print("KLUBBER:")

          for klubb, antall in sorted(
              klubber.items()
          ):

              print(
                  f"  {klubb}: "
                  f"{antall} resultater"
              )


          print()
          print("=" * 60)

          PY


      # ------------------------------------------------------
      # LAGRE DATA
      # ------------------------------------------------------

      - name: Lagre oppdaterte data
        run: |

          git config --global user.name \
            "GitHub Action Bot"

          git config --global user.email \
            "bot@github.com"


          git add \
            stevner.txt \
            data/resultater.json


          git diff --cached --quiet || \
            git commit \
              -m "Auto-oppdatert svømmedata fra Medley"


          git pull --rebase origin main


          git push

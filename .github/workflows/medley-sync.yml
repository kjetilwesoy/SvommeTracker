name: Oppdater Svømmedata fra LENEX

on:
  workflow_dispatch: # Lar deg starte skriptet manuelt
  push:
    paths:
      - 'stevner.txt'
      - '.github/workflows/medley-sync.yml'
      - 'parse_lenex.py'

permissions:
  contents: write # Gir boten lov til å lagre resultater.json

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Sjekk ut koden
        uses: actions/checkout@v4

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer pakker
        run: pip install requests

      - name: Kjøre LENEX-parser
        run: python parse_lenex.py

      - name: Lagre og push oppdaterte data
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "bot@github.com"
          git add data/resultater.json
          git commit -m "Auto-oppdatert svømmedata fra LENEX" || exit 0
          git push
